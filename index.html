<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#25221f">
<meta name="description" content="A private personal home library catalog.">
<link rel="manifest" href="manifest.webmanifest">
<title>My Home Library</title>
<style>
:root{--bg:#f3efe7;--paper:#fffdf8;--ink:#28251f;--muted:#746d62;--line:#ded6c9;--accent:#6b4935;--accent2:#a17b58;--green:#526b50;--red:#934d42;--shadow:0 8px 26px #30251912}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{background:#25221f;color:#f8f2e8;padding:22px 18px 18px;position:sticky;top:0;z-index:5;box-shadow:0 3px 14px #0002}
.head{max-width:980px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand small{display:block;color:#c6b9a7;letter-spacing:.15em;text-transform:uppercase;font-size:10px}.brand h1{font:normal 27px Georgia,serif;margin:3px 0 0}
button,.btn{border:0;border-radius:10px;background:var(--accent);color:white;padding:11px 14px;font-weight:650;font-size:14px;cursor:pointer}
button.secondary{background:#e9e1d5;color:var(--ink)}button.danger{background:#f2e2de;color:#823d34}button:disabled{opacity:.5}
main{max-width:980px;margin:22px auto;padding:0 16px 48px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:12px 14px;box-shadow:var(--shadow)}
.stat strong{display:block;font:25px Georgia,serif}.stat span{color:var(--muted);font-size:12px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.toolbar input{flex:1;min-width:170px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:#fffefa;color:var(--ink);padding:11px;font:inherit}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 5px}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:9px;margin:12px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:15px}
.book{background:var(--paper);border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
.book:active{transform:scale(.98)}
.cover{height:190px;background:#e5ded2;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover}.placeholder{font:italic 17px Georgia,serif;color:#857867;text-align:center;padding:12px}
.bookinfo{padding:10px}.booktitle{font: bold 15px Georgia,serif;line-height:1.25}.author{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:10px;border-radius:20px;padding:3px 7px;background:#eee7dc;color:#5c4938;margin:7px 3px 0 0}
.status{background:#e7eee3;color:#40583e}.status.progress{background:#f4ead5;color:#785a27}
.empty{background:var(--paper);border:1px dashed #c9bdad;border-radius:15px;padding:35px 18px;text-align:center;color:var(--muted)}
dialog{border:0;border-radius:16px;padding:0;width:min(620px,calc(100% - 24px));max-height:92vh;box-shadow:0 20px 70px #0005;background:var(--paper);color:var(--ink)}
dialog::backdrop{background:#17130fcc}.modalhead{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modalhead h2{font:normal 22px Georgia,serif;margin:0}.modalbody{padding:18px;overflow:auto;max-height:calc(92vh - 130px)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field.full{grid-column:1/-1}.coverrow{display:flex;gap:13px;align-items:center}.preview{width:88px;height:118px;background:#e5ded2;border-radius:7px;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0}.preview img{width:100%;height:100%;object-fit:cover}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:14px 18px;border-top:1px solid var(--line)}
.detailcover{width:112px;height:155px;object-fit:cover;border-radius:8px;background:#e5ded2}.detailtop{display:flex;gap:15px}.detailtop h3{font:normal 22px Georgia,serif;margin:0 0 6px}.detailmeta{color:var(--muted);font-size:13px}.detailfields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.detailfields div{border-top:1px solid var(--line);padding-top:8px}.detailfields small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}.detailfields strong{font-size:14px;font-weight:600}
footer{text-align:center;color:var(--muted);font-size:11px;padding:25px 10px}
@media(max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.filters .wide{grid-column:1/-1}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.cover{height:190px}.formgrid{grid-template-columns:1fr 1fr}.brand h1{font-size:24px}}
@media(max-width:390px){.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.cover{height:165px}}
</style>
</head>
<body>
<header><div class="head"><div class="brand"><small>Personal collection</small><h1>My Home Library</h1></div><button id="addTop">＋ Add Book</button></div></header>
<main>
<section class="stats" aria-label="Library statistics">
 <div class="stat"><strong id="totalCount">0</strong><span>Total books</span></div>
 <div class="stat"><strong id="readCount">0</strong><span>Read</span></div>
 <div class="stat"><strong id="progressCount">0</strong><span>In progress</span></div>
 <div class="stat"><strong id="unreadCount">0</strong><span>Not read</span></div>
</section>
<div class="toolbar"><input id="search" placeholder="Search title or author…" aria-label="Search books"><button class="secondary" id="exportBtn">Backup</button><button class="secondary" id="importBtn">Restore</button><input type="file" id="importFile" accept="application/json" hidden></div>
<section class="filters">
 <select id="typeFilter" aria-label="Book type"><option value="">All book types</option><option>Fiction</option><option>Nonfiction</option></select>
 <select id="genreFilter" aria-label="Genre"><option value="">All genres</option></select>
 <select id="statusFilter" aria-label="Reading status"><option value="">All statuses</option><option>Not Read</option><option>In Progress</option><option>Read</option></select>
 <select id="formatFilter" aria-label="Format"><option value="">All formats</option><option>Hardback</option><option>Paperback</option></select>
</section>
<div id="bookGrid" class="grid"></div>
<footer>Your collection is stored on this device. Use Backup regularly to keep a copy safe.</footer>
</main>

<dialog id="bookDialog">
 <div class="modalhead"><h2 id="formTitle">Add a book</h2><button class="secondary" id="closeForm" aria-label="Close">✕</button></div>
 <form id="bookForm">
 <div class="modalbody">
  <div class="coverrow field full" style="margin-bottom:17px">
   <div class="preview" id="coverPreview"><span class="placeholder">Cover<br>photo</span></div>
   <div style="flex:1"><label for="coverFile">Book cover photograph</label><input id="coverFile" type="file" accept="image/*" capture="environment"><div style="font-size:11px;color:var(--muted);margin-top:5px">Take a picture or choose an image from your phone.</div></div>
  </div>
  <div class="formgrid">
   <div class="field full"><label for="title">Title *</label><input id="title" required maxlength="200" placeholder="Book title"></div>
   <div class="field full"><label for="author">Author</label><input id="author" maxlength="150" placeholder="Author's name"></div>
   <div class="field"><label for="format">Format</label><select id="format"><option>Hardback</option><option>Paperback</option><option value="Other">Other</option></select></div>
   <div class="field"><label for="bookType">Book type</label><select id="bookType"><option>Fiction</option><option>Nonfiction</option></select></div>
   <div class="field full"><label for="genre">Genre</label><select id="genre"></select></div>
   <div class="field full"><label for="status">Reading status</label><select id="status"><option>Not Read</option><option>In Progress</option><option>Read</option></select></div>
   <div class="field"><label for="dateStarted">Date started</label><input id="dateStarted" type="date"></div>
   <div class="field"><label for="dateFinished">Date finished</label><input id="dateFinished" type="date"></div>
   <div class="field"><label for="room">Room</label><input id="room" placeholder="e.g. Library"></div>
   <div class="field"><label for="bookcase">Bookcase</label><input id="bookcase" placeholder="e.g. Left wall"></div>
   <div class="field"><label for="shelf">Shelf</label><input id="shelf" placeholder="e.g. Shelf 2"></div>
   <div class="field"><label for="customLocation">Other location details</label><input id="customLocation" placeholder="Optional"></div>
   <div class="field full"><label for="notes">Notes (optional)</label><textarea id="notes" rows="2" placeholder="Edition, series, or other notes"></textarea></div>
  </div>
 </div>
 <div class="actions"><button type="button" class="secondary" id="cancelForm">Cancel</button><button type="submit">Save Book</button></div>
 </form>
</dialog>

<dialog id="detailDialog">
 <div class="modalhead"><h2>Book details</h2><button class="secondary" id="closeDetail">✕</button></div>
 <div class="modalbody" id="detailBody"></div>
 <div class="actions"><button class="danger" id="deleteBook">Delete</button><button class="secondary" id="editBook">Edit</button><button id="doneDetail">Done</button></div>
</dialog>
<script>
const DB_NAME='home-library-db', STORE='books';
const genres={
 Fiction:['Adventure','Classic Literature','Crime / Mystery','Fantasy','Historical Fiction','Horror','Literary Fiction','Romance','Science Fiction','Thriller','Western','Other'],
 Nonfiction:['Architecture','Art & Photography','Biography / Autobiography','Business / Economics','History – American','History – European','History – World','Philosophy','Politics / Government','Religion / Christianity','Science','Travel','Urban Planning','Self-Improvement','Other']
};
let db, books=[], editingId=null, selectedId=null, coverData=null;
const $=id=>document.getElementById(id);
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>req.result.createObjectStore(STORE,{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function allBooks(){return new Promise((resolve,reject)=>{const r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function saveBook(book){return new Promise((resolve,reject)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).put(book);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
function removeBook(id){return new Promise((resolve,reject)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function locationText(b){return [b.room,b.bookcase,b.shelf,b.customLocation].filter(Boolean).join(' › ')||'Not specified'}
function fillGenres(type,selectId,chosen=''){const el=$(selectId);el.innerHTML='';(genres[type]||genres.Fiction).forEach(g=>{const o=document.createElement('option');o.value=g;o.textContent=g;el.append(o)});if(chosen)el.value=chosen}
function refresh(){
 const q=$('search').value.trim().toLowerCase(),type=$('typeFilter').value,genre=$('genreFilter').value,status=$('statusFilter').value,format=$('formatFilter').value;
 $('totalCount').textContent=books.length;$('readCount').textContent=books.filter(b=>b.status==='Read').length;$('progressCount').textContent=books.filter(b=>b.status==='In Progress').length;$('unreadCount').textContent=books.filter(b=>b.status==='Not Read').length;
 const gs=[...new Set(books.map(b=>b.genre).filter(Boolean))].sort();const gf=$('genreFilter'),old=gf.value;gf.innerHTML='<option value="">All genres</option>';gs.forEach(g=>{const o=document.createElement('option');o.value=g;o.textContent=g;gf.append(o)});gf.value=gs.includes(old)?old:'';
 const filtered=books.filter(b=>(!q||(b.title+' '+(b.author||'')).toLowerCase().includes(q))&&(!type||b.bookType===type)&&(!genre||b.genre===genre)&&(!status||b.status===status)&&(!format||b.format===format)).sort((a,b)=>a.title.localeCompare(b.title));
 const grid=$('bookGrid');grid.innerHTML='';
 if(!filtered.length){grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><div style="font:26px Georgia,serif;margin-bottom:8px">${books.length?'No books match those filters':'Your library is waiting for its first book'}</div><div>${books.length?'Try changing your search or filters.':'Add a book to begin building your collection.'}</div>${books.length?'':'<button style="margin-top:15px" onclick="openForm()">＋ Add your first book</button>'}</div>`;return}
 filtered.forEach(b=>{const card=document.createElement('article');card.className='book';card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-label',`View ${b.title}`);card.innerHTML=`<div class="cover">${b.cover?`<img src="${b.cover}" alt="Cover of ${esc(b.title)}">`:`<div class="placeholder">${esc(b.title)}</div>`}</div><div class="bookinfo"><div class="booktitle">${esc(b.title)}</div><div class="author">${esc(b.author||'Author unknown')}</div><span class="tag">${esc(b.bookType||'')}</span><span class="tag status ${b.status==='In Progress'?'progress':''}">${esc(b.status||'Not Read')}</span></div>`;card.onclick=()=>showDetail(b.id);card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showDetail(b.id)}};grid.append(card)});
}
function resetForm(){ $('bookForm').reset();coverData=null;$('coverPreview').innerHTML='<span class="placeholder">Cover<br>photo</span>';fillGenres($('bookType').value,'genre');}
function openForm(id=null){
 editingId=id;resetForm();const b=id?books.find(x=>x.id===id):null;$('formTitle').textContent=b?'Edit book':'Add a book';
 if(b){$('title').value=b.title||'';$('author').value=b.author||'';$('format').value=b.format||'Hardback';$('bookType').value=b.bookType||'Fiction';fillGenres(b.bookType||'Fiction','genre',b.genre);$('status').value=b.status||'Not Read';$('dateStarted').value=b.dateStarted||'';$('dateFinished').value=b.dateFinished||'';$('room').value=b.room||'';$('bookcase').value=b.bookcase||'';$('shelf').value=b.shelf||'';$('customLocation').value=b.customLocation||'';$('notes').value=b.notes||'';coverData=b.cover||null;if(coverData)$('coverPreview').innerHTML=`<img src="${coverData}" alt="Cover preview">`}
 $('bookDialog').showModal();
}
window.openForm=openForm;
function showDetail(id){selectedId=id;const b=books.find(x=>x.id===id);if(!b)return;
 $('detailBody').innerHTML=`<div class="detailtop">${b.cover?`<img class="detailcover" src="${b.cover}" alt="Cover of ${esc(b.title)}">`:`<div class="detailcover placeholder">No cover</div>`}<div><h3>${esc(b.title)}</h3><div>${esc(b.author||'Author unknown')}</div><div class="detailmeta">${esc(b.format)} · ${esc(b.bookType)} · ${esc(b.genre||'No genre')}</div><span class="tag status ${b.status==='In Progress'?'progress':''}">${esc(b.status)}</span></div></div><div class="detailfields">${[['Date started',b.dateStarted],['Date finished',b.dateFinished],['Storage location',locationText(b)],['Notes',b.notes||'—']].map(([k,v])=>`<div><small>${k}</small><strong>${esc(v||'—')}</strong></div>`).join('')}</div>`;
 $('detailDialog').showModal();
}
$('addTop').onclick=()=>openForm();$('closeForm').onclick=$('cancelForm').onclick=()=> $('bookDialog').close();
$('closeDetail').onclick=$('doneDetail').onclick=()=> $('detailDialog').close();
$('editBook').onclick=()=>{const id=selectedId;$('detailDialog').close();openForm(id)};
$('deleteBook').onclick=async()=>{if(confirm('Delete this book from your library? This cannot be undone.')){await removeBook(selectedId);$('detailDialog').close();await reload()}};
$('bookType').onchange=()=>fillGenres($('bookType').value,'genre');
$('coverFile').onchange=async e=>{const file=e.target.files[0];if(!file)return; if(!file.type.startsWith('image/')){alert('Please choose an image file.');return}const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});const img=new Image();img.onload=()=>{const max=1000,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);coverData=c.toDataURL('image/jpeg',.82);$('coverPreview').innerHTML=`<img src="${coverData}" alt="Cover preview">`};img.src=data};
$('bookForm').onsubmit=async e=>{e.preventDefault();const old=editingId?books.find(x=>x.id===editingId):null;const b={id:editingId||crypto.randomUUID(),title:$('title').value.trim(),author:$('author').value.trim(),format:$('format').value,bookType:$('bookType').value,genre:$('genre').value,status:$('status').value,dateStarted:$('dateStarted').value,dateFinished:$('dateFinished').value,room:$('room').value.trim(),bookcase:$('bookcase').value.trim(),shelf:$('shelf').value.trim(),customLocation:$('customLocation').value.trim(),notes:$('notes').value.trim(),cover:coverData};await saveBook(b);$('bookDialog').close();await reload()};
async function reload(){books=await allBooks();refresh()}
['search','typeFilter','genreFilter','statusFilter','formatFilter'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',refresh));
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({app:'My Home Library',version:1,exportedAt:new Date().toISOString(),books},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-home-library-backup.json';a.click();URL.revokeObjectURL(a.href)};
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text());if(!Array.isArray(parsed.books))throw Error('This backup does not contain a book list.');if(!confirm(`Restore ${parsed.books.length} books? Existing books with matching IDs will be updated; other books will remain.`))return;for(const b of parsed.books){if(!b.id)b.id=crypto.randomUUID();if(!b.title)continue;await saveBook(b)}await reload();alert('Library backup restored.')}catch(err){alert('Could not restore this file: '+err.message)}e.target.value=''};
(async()=>{try{db=await openDB();await reload();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){alert('Could not open the local book database in this browser. Please use a current version of Chrome.')}})();
</script>
</body></html>
